[pytest]
# Configuration pytest pour la plateforme SPARQL

# Répertoire des tests
testpaths = tests

# Pattern de découverte des fichiers de tests
python_files = test_*.py

# Pattern de découverte des classes de tests
python_classes = Test*

# Pattern de découverte des méthodes de tests
python_functions = test_*

# Options par défaut
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes

# Markers personnalisés
markers =
    unit: Tests unitaires rapides sans dépendances externes
    integration: Tests d'intégration nécessitant des endpoints SPARQL actifs
    slow: Tests lents pouvant prendre plusieurs secondes

# Configuration de la couverture de code (si pytest-cov est installé)
[coverage:run]
source = .
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
